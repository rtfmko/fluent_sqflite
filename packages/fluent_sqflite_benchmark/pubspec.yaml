name: fluent_sqflite_benchmark
description: "Benchmarks of fluent_sqflite: parallel reads, UI stalls, and queue / save / relation / delete scenarios with regression comparison."
version: 2.0.0-dev.3
homepage: https://github.com/rtfmko/fluent_sqflite
# Until fluent_sqflite 2.0.0 is on pub.dev: then remove this line and depend on fluent_sqflite: ^2.0.0.
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  fluent_sqflite:
    path: ../..
  sqflite: ^2.4.5
  sqflite_common: ^2.5.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fluent_sqflite_test:
    path: ../fluent_sqflite_test
