name: fluent_sqflite
description: "A powerful, developer-friendly DAO-based database engine for Flutter. Features automated schema synchronization, smart migrations, and built-in relation management for sqflite."
version: 1.0.14+2
homepage:

environment:
  sdk: ^3.10.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  plugin:
    platforms:
      android:
        package: dev.rtfm.fluent_sqflite
        pluginClass: FluentSqflitePlugin
      ios:
        pluginClass: FluentSqflitePlugin
      macos:
        pluginClass: FluentSqflitePlugin
